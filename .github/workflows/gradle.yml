# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on: [push, pull_request]

jobs:
  build:
    runs-on: namespace-profile-linux-default
    steps:
    - name: Checkout Repository
      uses: namespacelabs/nscloud-checkout-action@v9
      with:
        persist-credentials: false
    - name: Set up cache
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: gradle
    - name: Setup gradle build cache
      run: |
        nsc cache gradle setup --init-gradle /tmp/init.gradle
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: true # namespace handles this
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'zulu'
        cache: "" # namespace handles this
    - name: Build with Gradle
      run: ./gradlew --init-script=/tmp/init.gradle build
